# =============================================================================
#  !!! SECURITY RULE FOR DEVELOPERS AND AI AGENTS: DOCKER PORTS ONLY ON 127.0.0.170 !!!
# =============================================================================
#  Every port in this file is published on 127.0.0.170, this project's own
#  loopback address: one address per project, so several projects can run
#  side by side on one machine without port conflicts.
#
#  NEVER publish a port on 0.0.0.0. Each of these does exactly that, so all are FORBIDDEN:
#      "8080:80"    "0.0.0.0:8080:80"    ":8080:80"    "[::]:8080:80"    "80"
#  0.0.0.0 means every network the machine is on: the office or cafe Wi-Fi, the
#  VPN and, on a server, the whole internet. Docker writes its own iptables rules,
#  so firewalld/ufw do NOT protect a published port. Exposed dev databases, admin
#  panels and APIs are found and broken into within hours by automated, AI-driven
#  scanners.
#
#      ports:
#        - "127.0.0.170:8443:443"   # right: only this machine
#        - "8443:443"               # FORBIDDEN: the whole network
#
#  - Inside the container the app may listen on 0.0.0.0: this rule is about the
#    HOST side of `ports:` (and about apps run with `network_mode: host`).
#  - Another device needs it (a phone, a colleague)? Use `ssh -L`, Teleport or
#    `adb reverse`, never 0.0.0.0. The same goes for `docker run -p`.
#  - macOS: run `sudo ifconfig lo0 alias 127.0.0.170 up` once after each boot.
#  - AI AGENTS: never change an address to 0.0.0.0, never drop it and never
#    widen it to "fix" a connection; point the client at 127.0.0.170. Stop and ask
#    the owner before any other address. A change that opens a port is refused.
# =============================================================================
name: "ecc-sp"
volumes:
  db:
  app:
services:
  # =================== ECC ==================== #
  core-service-http:
    image: "${REGISTRY_DOMAIN}/${CORE_VERSION}"
    command: ["ecc", "service:http"]
    restart: "always"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      kv:
        condition: service_healthy
      db:
        condition: service_healthy
      core-prepare:
        condition: service_completed_successfully
    volumes:
      - "/etc/ssl:/etc/ssl:ro"
      - "/etc/pki:/etc/pki:ro"
      - "/usr/share/zoneinfo:/usr/share/zoneinfo:ro"
      - "app:/ecc/data"
    env_file:
      - docker/env/core.env
      - docker/env/db.env
      - docker/env/kv.env
    healthcheck:
      test: [ "CMD-SHELL","curl --fail http://127.0.0.1:8080/api/health || exit 1" ]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 5s
      
  
  core-service-siamev-async:
    image: "${REGISTRY_DOMAIN}/${CORE_VERSION}"
    command: ["ecc", "service:siamev:fiscal_receipt"]
    restart: "always"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      kv:
        condition: service_healthy
      db:
        condition: service_healthy
      core-prepare:
        condition: service_completed_successfully
    volumes:
      - "/etc/ssl:/etc/ssl:ro"
      - "/etc/pki:/etc/pki:ro"
      - "/usr/share/zoneinfo:/usr/share/zoneinfo:ro"
      - "app:/ecc/data"
    env_file:
      - docker/env/core.env
      - docker/env/db.env
      - docker/env/kv.env
  
  core-service-sms-email-async:
    image: "${REGISTRY_DOMAIN}/${CORE_VERSION}"
    command: ["ecc", "service:sms_email:sms_email_updater"]
    restart: "always"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      kv:
        condition: service_healthy
      db:
        condition: service_healthy
      core-prepare:
        condition: service_completed_successfully
    volumes:
      - "/etc/ssl:/etc/ssl:ro"
      - "/etc/pki:/etc/pki:ro"
      - "/usr/share/zoneinfo:/usr/share/zoneinfo:ro"
      - "app:/ecc/data"
    env_file:
      - docker/env/core.env
      - docker/env/db.env
      - docker/env/kv.env
 
  core-prepare:
    image: "${REGISTRY_DOMAIN}/${CORE_VERSION}"
    command: ["ecc", "db:auto-migrate"]
    restart: "on-failure"
    depends_on:
      kv:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - "/etc/ssl:/etc/ssl:ro"
      - "/etc/pki:/etc/pki:ro"
      - "/usr/share/zoneinfo:/usr/share/zoneinfo:ro"
      - "app:/ecc/data"
    env_file:
      - docker/env/core.env
      - docker/env/db.env
      - docker/env/kv.env

  # =================== ECC ==================== #
 

  # ============ SECONDARY SERVICES ============ #

  proxy:
    restart: "always"
    image: "${REGISTRY_DOMAIN}/${PROXY_VERSION}"
    ports:
      - "127.0.0.170:8443:443"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:8888/ping || exit 1"]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 5s

  db:
    image: "${REGISTRY_DOMAIN}/${DB_VERSION}"
    command: "start-single-node"
    restart: "always"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - db:/cockroach/cockroach-data
    healthcheck:
      test: [ "CMD-SHELL","curl --fail http://localhost:8080/health || exit 1" ]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s

  kv:
    restart: "always"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    image: "${REGISTRY_DOMAIN}/${KV_VERSION}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 5
      start_period: 10s
      timeout: 5s
  # ============ SECONDARY SERVICES ============ #
  